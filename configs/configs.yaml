seed: 42
device: 'cuda:0'
batch_size: 32
epochs: 100
wandb: False
data_dir: './data/'
x_mode: Initial
batch_size: 32
test_size: 0.2
num_epochs: 100

loss_params:
  regression_loss: 
    loss: 'MSE'
    reduction: 'sum'
  label_loss:
    loss: 'MSE'
    weight: 0.8
  reduction: 'mean'
  

optimizer: 'Adam'
optimizer_params:
  lr: 0.001
  weight_decay: 0.0


scheduler: 'ReduceLROnPlateau'
scheduler_params:
  mode: 'min'
  factor: 0.1
  patience: 10
  threshold: 0.0001
  threshold_mode: 'rel'
  cooldown: 0
  min_lr: 0
  eps: 1e-08

early_stopping: True
early_stopping_params:
  patience: 20
  min_delta: 0.0001
  mode: 'min'
  monitor: 'val_loss'
  verbose: False

identification_model: 'MLP' # RNN LSTM GRU
identification_model_params:
  num_blocks: 2
  block_layers: [2, 2]
  hidden_size: [[64, 128],[128, 128]]
  dropout_rate: 0.2
  activation: 'ReLU'
  norm_type: 'BatchNorm'
  residual: False

# AParam_model: 'MLP'
